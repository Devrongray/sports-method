name: Daily price histories

on:
  schedule:
    - cron: "20 9 * * *"        # 09:20 UTC, after the US night slate has resolved
  workflow_dispatch:
    inputs:
      hours:
        description: "Games that started within the last N hours"
        default: "30"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m method.snapshot history --out data --hours ${{ github.event.inputs.hours || '30' }}
      - run: bash scripts/commit_data.sh data
