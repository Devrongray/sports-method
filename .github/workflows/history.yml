name: Daily price histories

on:
  schedule:
    - cron: "20 9 * * *"        # 09:20 UTC, after the US night slate has resolved
  workflow_dispatch:
    inputs:
      hours:
        description: "Games that started within the last N hours"
        default: "30"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the data branch (recorded market slugs)
        run: |
          git fetch --depth 1 origin "+refs/heads/data:refs/remotes/origin/data" || true
          git worktree add --detach data-wt refs/remotes/origin/data 2>/dev/null || mkdir -p data-wt/data
      - run: python -m method.snapshot history --out data --hours ${{ github.event.inputs.hours || '30' }} --recorded data-wt/data
      - run: git worktree remove --force data-wt 2>/dev/null || true
      - run: bash scripts/commit_data.sh data
