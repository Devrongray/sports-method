name: News timestamps (MLB lineups, NBA injury reports, NHL goalies)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to loop"
        default: "27"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m method.news.record --out data --minutes ${{ github.event.inputs.minutes || '27' }}
      - run: bash scripts/commit_data.sh data
