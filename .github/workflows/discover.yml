name: Discover Polymarket US leagues

# Writes the live league list and a check of every configured slug to
# analysis/discovery/, so the config can be corrected without reading logs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "analysis/**"
      - "data/**"
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: "10 8 * * *"        # daily 08:10 UTC

permissions:
  contents: write

concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m method.snapshot discover --out analysis/discovery
      - name: Commit results
        run: |
          bash scripts/commit_main.sh analysis/discovery "discovery: Polymarket US leagues $(date -u +%F)"
