name: Daily analysis

on:
  schedule:
    - cron: "5 10 * * *"        # 10:05 UTC, after the 09:20 history pull
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the data branch
        run: |
          git fetch --depth 1 origin "+refs/heads/data:refs/remotes/origin/data"
          git worktree add --detach data-wt refs/remotes/origin/data
      - run: python -m method.analysis.report --data data-wt/data --out analysis/daily
      - name: Commit results
        run: |
          git worktree remove --force data-wt
          bash scripts/commit_main.sh analysis/daily "analysis: daily report $(date -u +%F)"
