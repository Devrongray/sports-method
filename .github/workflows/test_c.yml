name: Test (c) Pinnacle reliability

on:
  push:
    branches: [main]
    paths-ignore:
      - "analysis/**"
      - "data/**"
      - "**.md"
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * 1"       # Mondays 10:40 UTC

permissions:
  contents: write

concurrency:
  group: test-c
  cancel-in-progress: false

jobs:
  test_c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m method.pinnacle_reliability --out analysis/test_c
      - uses: actions/upload-artifact@v4
        with:
          name: test_c
          path: analysis/test_c
      - name: Commit results
        run: |
          bash scripts/commit_main.sh analysis/test_c "test (c): Pinnacle reliability $(date -u +%F)"
